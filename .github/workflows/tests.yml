name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hexbadge
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, openssl, curl
          coverage: none

      - name: Schema + production migration (must stay idempotent on top of it)
        run: |
          mysql -h 127.0.0.1 -uroot -proot hexbadge < database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot hexbadge < MIGRATION-PROD.sql

      - name: .env for the tests
        run: |
          printf '%s\n' APP_ENV=testing DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=hexbadge \
            DB_USER=root DB_PASS=root DB_CHARSET=utf8mb4 > .env

      - run: php tests/oidc_test.php
      - run: php tests/auth_db_test.php
