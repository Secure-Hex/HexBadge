name: Release

# Versionado automático: en cada push a main, si hay commits releasables
# (feat/fix/perf/refactor/BREAKING) desde el último tag, crea la nueva versión,
# el CHANGELOG, el tag y la GitHub Release. Reusa scripts/release.sh.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Evita re-disparar sobre el propio commit de release (además, los push
    # hechos con GITHUB_TOKEN no disparan workflows).
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # historial completo + tags para el versionado

      - name: Configurar git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar versión, changelog y tag
        id: release
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          ./scripts/release.sh
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$before" != "$after" ] && [ -n "$after" ]; then
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          else
            echo "Sin release en este push."
          fi

      - name: Push del commit y el tag
        if: steps.release.outputs.tag
        run: git push --follow-tags origin HEAD:main

      - name: Crear GitHub Release
        if: steps.release.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas = la sección más reciente del CHANGELOG (sin la línea del título).
          notes=$(awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md | tail -n +2)
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes "$notes"

  # El deploy espera a que el workflow Tests termine en verde sobre el commit que disparó
  # el release (el commit de release solo toca VERSION y CHANGELOG, y al subirlo con
  # GITHUB_TOKEN no dispara Tests).
  tests-passed:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Esperar el workflow Tests del commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id=
          for _ in $(seq 30); do
            id=$(gh run list --workflow tests.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "no hay ejecución de Tests para $SHA" >&2; exit 1; }
          gh run watch "$id" --exit-status --interval 15

  deploy:
    needs: [release, tests-passed]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag }}
